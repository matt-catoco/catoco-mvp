<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D2020">
<title>You're offline · Catoco</title>
<!--
  Offline fallback (app-store prep, prompt A). Fully self-contained (inline
  CSS and SVG, no fonts, no scripts beyond the retry button) because it is
  shown when there is no network: the service worker (public/sw.js) serves it
  for failed page loads, and the native app shell can bundle the same file.
-->
<style>
  :root { --paper:#FAFAF7; --ink:#0D2020; --teal:#2DD4BF; --teal-deep:#0F8C7E; --muted:#6B6B64; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0D2020; --ink:#FAFAF7; --muted:#8FA6A3; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
    min-height: 100dvh;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  main { max-width: 22rem; }
  svg { width: 72px; height: 72px; }
  h1 { font-size: 24px; margin: 20px 0 8px; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); }
  button {
    margin-top: 24px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 999px;
    background: var(--teal); color: #0D2020; font: 600 15px/1 inherit; cursor: pointer;
  }
  button:hover { background: var(--teal-deep); color: #fff; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 512 512" aria-hidden="true">
    <rect width="512" height="512" rx="113" fill="#2DD4BF"/>
    <rect x="77" y="77" width="358" height="358" rx="61" fill="none" stroke="#0D2020" stroke-width="15" stroke-dasharray="15,20"/>
    <rect x="184" y="184" width="144" height="144" rx="31" fill="#0D2020" transform="rotate(45 256 256)"/>
  </svg>
  <h1>You're offline</h1>
  <p>Catoco needs a connection to load your trips. Check your internet and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
